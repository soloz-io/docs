server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Relative redirects: an absolute one would name this pod's internal port.
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Static build assets are hashed and can be cached long-term
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /_mintlify/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA / SSG routing fallback: serve index files in subdirectories or fall back to /index.html
    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
