# Required at admission by the spoke's Kyverno require-cost-labels rule.
tenantId: nutgraf
appId: docs
costCenter: platform

image:
  repository: ghcr.io/soloz-io/docs/nutgraf-docs-frontend
  digest: ""
  pullSecret: ghcr-pull-secret

replicas: 1

service:
  # FIXED. The gateway serves / from frontend-workload:3000 by platform
  # convention; another port answers nothing.
  port: 3000

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi
