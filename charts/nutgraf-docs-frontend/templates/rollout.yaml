{{/*
ADR-021 / ADR-022: the hardened stateless-web shape. Enforced at admission by
the spoke's Kyverno policy, so weakening it is rejected by the cluster.
*/}}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "nutgraf-docs-frontend.workload" . }}
  labels:
    {{- include "nutgraf-docs-frontend.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    canary:
      steps:
        - setWeight: 100
  selector:
    matchLabels:
      {{- include "nutgraf-docs-frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nutgraf-docs-frontend.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "nutgraf-docs-frontend.workload" . }}-sa
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      containers:
        - name: nutgraf-docs-frontend
          image: {{ include "nutgraf-docs-frontend.image" . }}
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
              protocol: TCP
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
