apiVersion: v1
kind: Service
metadata:
  name: {{ include "nutgraf-docs-frontend.workload" . }}
  labels:
    {{- include "nutgraf-docs-frontend.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "nutgraf-docs-frontend.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
